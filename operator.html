<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/portal.css">
<title>Вход за оператори | БУЛАДМИН</title>
<script type="module" src="/assets/js/login.js"></script>
</head>
<body data-role="operator">
<header class="site-header"><div class="wrap site-header__inner"><a class="brand" href="/"><img src="/assets/img/logo-mark.webp" alt="" width="38" height="38"><span class="brand__word">БУЛ<b>АДМИН</b></span><span class="brand__tag">Оператори</span></a></div></header>
<main id="main"><div class="wrap wrap--narrow section">
  <section class="card login__card" aria-labelledby="signin-title">
    <h1 id="signin-title">Вход за оператори</h1>
    <div id="login-error" class="alert alert--error" role="alert" hidden>Входът не успя. Опитайте отново.</div>
    <form id="login-form" class="form" novalidate>
      <div class="field"><label for="f-email">Имейл</label><input id="f-email" name="email" type="email" autocomplete="username" maxlength="200" required></div>
      <div class="field"><label for="f-password">Парола</label><input id="f-password" name="password" type="password" autocomplete="current-password" maxlength="128" required></div>
      <div id="form-alert" aria-live="polite"></div>
      <button class="btn" type="submit" id="login-submit">Вход</button>
    </form>
    <button type="button" id="forgot-button" class="link-btn small" hidden>Забравена парола?</button>
    <div class="divider"><span>или със свързан акаунт</span></div>
    <a class="btn btn--provider" href="/api/auth/google/start">Продължете с Google</a>
    <a class="btn btn--provider" href="/api/auth/microsoft/start">Продължете с Microsoft</a>
    <p class="login__note">Акаунт се създава само с покана от администратор. Google или Microsoft се свързват след първия вход от „Моят акаунт“.</p>
  </section>
</div></main>
<footer class="site-footer"><div class="wrap"><span>© 2026 БУЛАДМИН</span><span><a href="/">Портал за клиенти</a></span></div></footer>
</body>
</html>
