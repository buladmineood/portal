<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/assets/css/portal.css">
<title>Задаване на парола | БУЛАДМИН</title>
<script type="module" src="/assets/js/set-password.js"></script>
</head>
<body>
<header class="site-header"><div class="wrap site-header__inner"><a class="brand" href="/"><img src="/assets/img/logo-mark.webp" alt="" width="38" height="38"><span class="brand__word">БУЛ<b>АДМИН</b></span></a></div></header>
<main id="main"><div class="wrap wrap--narrow section">
  <section class="card login__card">
    <h1>Задайте парола</h1>
    <form id="password-form" class="form" novalidate>
      <div class="field"><label for="f-password">Нова парола <span class="field__hint">(поне 10 знака)</span></label><input id="f-password" name="password" type="password" autocomplete="new-password" maxlength="128" required></div>
      <div class="field"><label for="f-confirm">Повторете паролата</label><input id="f-confirm" name="confirm" type="password" autocomplete="new-password" maxlength="128" required></div>
      <div id="form-alert" aria-live="polite"></div>
      <button class="btn" type="submit">Запазете</button>
    </form>
  </section>
</div></main>
</body>
</html>
